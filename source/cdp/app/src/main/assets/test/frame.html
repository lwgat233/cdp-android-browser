<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>iframe 录制测试页</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 10px; background: #fff; color: #111; }
  h1 { font-size: 16px; }
  .box { border: 1px solid #ccc; border-radius: 8px; padding: 8px; }
  iframe { width: 100%; height: 420px; border: 1px solid #999; border-radius: 8px; }
  .pad { height: 700px; }
</style></head>
<body>
<h1>iframe 录制测试页（模拟"播放器在 iframe 里"的站点）</h1>
<div class="box">外层文档的一个按钮：<button id="outerBtn" onclick="document.title='outer clicked'">外层按钮</button></div>
<iframe id="fr" src="inner.html"></iframe>
<div class="pad"></div>
</body></html>
